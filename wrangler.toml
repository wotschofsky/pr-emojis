name = "pr-emojis"
main = "src/index.ts"
compatibility_date = "2025-09-15"
compatibility_flags = ["nodejs_compat"]

# Secrets are set with `wrangler secret put …`:
#   GITHUB_APP_ID, GITHUB_WEBHOOK_SECRET, GITHUB_APP_PRIVATE_KEY, GOOGLE_GENERATIVE_AI_API_KEY

[[kv_namespaces]]
binding = "LOCKS"
id = "3a4215d2c1ec4d36985534de944d399b"

# Static landing page served from /public at /.
[assets]
directory = "./public"
binding = "ASSETS"

[observability]
enabled = true
